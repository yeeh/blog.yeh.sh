<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">最终旁路由：一个 Wi-Fi，按 DNS 结果自动分流</title>
  <desc id="desc">交换机连接一个旁路由。客户端连接唯一 Wi-Fi 并先请求 AdGuard Home；MosDNS 按域名分流，直连域名返回真实 IP，代理域名经代理主机生成 Fake-IP。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#49647e"/></marker>
    <style>.bg{fill:#f8fbfd}.box{fill:#fff;stroke:#49647e;stroke-width:2;rx:12}.group{fill:#f4f8fc;stroke:#49647e;stroke-width:2.5;rx:16}.dns{fill:#edf8ef;stroke:#387b56;stroke-width:2;rx:12}.proxy{fill:#fff2e7;stroke:#b7692d;stroke-width:2;rx:12}.wifi{fill:#eef4fc;stroke:#4c70a3;stroke-width:2;rx:12}.line{stroke:#49647e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.green{stroke:#387b56;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.orange{stroke:#b7692d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font:600 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1f3447}.small{font:17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#40586c}.direct{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2e6e4a}.fake{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#98531f}</style>
  </defs>
  <rect class="bg" width="1200" height="780"/>
  <text x="600" y="45" text-anchor="middle" class="label" style="font-size:28px">最终旁路由：一个 Wi-Fi，按 DNS 结果自动分流</text>
  <rect class="box" x="45" y="115" width="135" height="75"/><text x="112" y="145" text-anchor="middle" class="label">光猫</text><text x="112" y="171" text-anchor="middle" class="small">Internet</text>
  <rect class="box" x="250" y="105" width="190" height="95"/><text x="345" y="140" text-anchor="middle" class="label">主路由</text><text x="345" y="170" text-anchor="middle" class="small">网关 10.0.0.1</text>
  <rect class="box" x="510" y="115" width="165" height="75"/><text x="592" y="145" text-anchor="middle" class="label">交换机</text><text x="592" y="171" text-anchor="middle" class="small">现有 LAN</text>
  <rect class="wifi" x="745" y="105" width="205" height="95"/><text x="847" y="140" text-anchor="middle" class="label">AP：一个 Wi-Fi</text><text x="847" y="170" text-anchor="middle" class="small">无需切换 SSID</text>
  <rect class="wifi" x="1020" y="105" width="145" height="95"/><text x="1092" y="140" text-anchor="middle" class="label">客户端</text><text x="1092" y="170" text-anchor="middle" class="small">自动分流</text>
  <path class="line" d="M180 152 H250"/><path class="line" d="M440 152 H510"/><path class="line" d="M675 152 H745"/><path class="line" d="M950 152 H1020"/>

  <rect class="group" x="400" y="290" width="405" height="370"/><text x="430" y="332" class="label" style="font-size:25px">旁路由</text>
  <rect class="dns" x="455" y="365" width="295" height="110"/><text x="602" y="400" text-anchor="middle" class="label">DNS 服务</text><text x="602" y="430" text-anchor="middle" class="small">AdGuard Home → MosDNS</text><text x="602" y="455" text-anchor="middle" class="small">10.0.1.114 · 域名分流</text>
  <rect class="proxy" x="455" y="515" width="295" height="110"/><text x="602" y="550" text-anchor="middle" class="label">代理主机</text><text x="602" y="580" text-anchor="middle" class="small">Surge / Mihomo · 10.0.1.120</text><text x="602" y="605" text-anchor="middle" class="small">Fake-IP 与代理出口</text>

  <path class="line" d="M592 190 V290"/><text x="620" y="245" class="small">LAN 接入</text>
  <path class="green" d="M1092 200 V255 H750 V365"/><text x="910" y="243" text-anchor="middle" class="direct">1. 客户端先请求 AdGuard Home</text>
  <path class="orange" d="M602 475 V515"/><text x="635" y="500" class="fake">代理域名</text>
  <path class="green" d="M455 420 H300 V265 H345 V200"/><text x="225" y="245" text-anchor="middle" class="direct">2a. 直连域名 → 真实 IP</text><text x="225" y="268" text-anchor="middle" class="direct">→ 主路由直接出网</text>
  <path class="orange" d="M750 570 H960 V715 H375 V200"/><text x="695" y="748" text-anchor="middle" class="fake">2b. 代理域名 → Fake-IP → 主路由静态路由 → 代理主机 → 代理出口</text>
</svg>
